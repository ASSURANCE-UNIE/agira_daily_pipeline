[project]
name = "agira-daily-pipeline"
version = "0.1.0"
description = "Daily SQL-to-AGIRA question and termination file pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agira-ra-translator>=0.2,<1",
]

[project.optional-dependencies]
database = ["pyodbc>=5,<6"]

[project.scripts]
agira-daily = "agira_daily.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agira_daily"]

[tool.uv.sources]
agira-ra-translator = { path = "agira", editable = true }

[tool.pytest.ini_options]
addopts = "-q --basetemp=.test_tmp -p no:cacheprovider"
pythonpath = ["src", "agira/src"]
testpaths = ["tests"]
