[project]
name = "agira-ra-translator"
version = "0.2.0"
description = "Stateless JSON and AGIRA RA fixed-width translator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
agira-translate = "agira_api.cli:main"

[dependency-groups]
dev = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agira_api"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.uv-cache",
    "/.venv",
    "/dist",
    "/tmp",
]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest_tmp"
pythonpath = ["src"]
testpaths = ["tests"]
